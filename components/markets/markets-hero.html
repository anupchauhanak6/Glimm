<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Markets Hero Section -->
    <section class="markets-hero">
      <!-- Background Video Layer -->
      <div class="markets-hero__video-container">
        <video
          class="markets-hero__video"
          autoplay
          muted
          loop
          playsinline
          poster="assets/videos/hero-poster.jpg"
        >
          <source src="../assets/videos/hero-hologram.mp4" type="video/mp4" />
          <source src="../assets/videos/hero-hologram.webm" type="video/webm" />
        </video>
        <!-- Dark Gradient Overlay -->
        <div class="markets-hero__overlay"></div>
      </div>

      <!-- Hero Content -->
      <div class="markets-hero__content">
        <div class="markets-hero__text-wrapper">
          <h1
            class="markets-hero__title fade-in-up"
            style="animation-delay: 0.1s"
          >
            Markets We Serve
          </h1>
          <p
            class="markets-hero__subtitle fade-in-up"
            style="animation-delay: 0.2s"
          >
            Transforming industries with holographic experiences
          </p>
        </div>
      </div>
    </section>

    <style>
      /* ===========================================
           UNIVERSAL BOX SIZING
           =========================================== */
      .markets-hero *,
      .markets-hero *::before,
      .markets-hero *::after {
        box-sizing: border-box;
      }

      /* ===========================================
           MARKETS HERO SECTION - CSS VARIABLES
           =========================================== */
      :root {
        --hero-navy: #0a0e27;
        --hero-blue: #1a237e;
        --hero-gold: #d4af37;
        --hero-white: #ffffff;
        --hero-overlay: rgba(10, 14, 39, 0.75);
      }

      /* ===========================================
           HERO SECTION BASE LAYOUT
           =========================================== */
      .markets-hero {
        position: relative;
        width: 100%;
        max-width: 100vw;
        height: 75vh;
        min-height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }

      /* ===========================================
           VIDEO BACKGROUND
           =========================================== */
      .markets-hero__video-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .markets-hero__video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .markets-hero__overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(26, 35, 126, 0.85) 0%,
          rgba(10, 14, 39, 0.9) 100%
        );
        z-index: 2;
      }

      /* ===========================================
           HERO CONTENT
           =========================================== */
      .markets-hero__content {
        position: relative;
        z-index: 3;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 40px;
        text-align: center;
      }

      .markets-hero__text-wrapper {
        max-width: 850px;
        margin: 0 auto;
      }

      .markets-hero__title {
        font-size: 62px;
        font-weight: 800;
        line-height: 1.15;
        color: var(--hero-white);
        margin: 0 0 24px 0;
        letter-spacing: -1.5px;
      }

      .markets-hero__subtitle {
        font-size: 22px;
        font-weight: 500;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.92);
        margin: 0;
        letter-spacing: -0.2px;
      }

      /* ===========================================
           ANIMATION KEYFRAMES
           =========================================== */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in-up {
        animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        opacity: 0;
      }

      /* ===========================================
           RESPONSIVE BREAKPOINTS
           =========================================== */

      /* Large Desktop: 1400px+ */
      @media (min-width: 1400px) {
        .markets-hero__title {
          font-size: 68px;
        }
        .markets-hero__subtitle {
          font-size: 24px;
        }
      }

      /* Desktop: 1200px - 1399px */
      @media (max-width: 1399px) {
        .markets-hero__title {
          font-size: 58px;
        }
        .markets-hero__subtitle {
          font-size: 21px;
        }
      }

      /* Tablet Large: 900px - 1199px */
      @media (max-width: 1199px) {
        .markets-hero {
          height: 70vh;
          min-height: 480px;
        }
        .markets-hero__content {
          padding: 0 30px;
        }
        .markets-hero__title {
          font-size: 52px;
          letter-spacing: -1.2px;
        }
        .markets-hero__subtitle {
          font-size: 20px;
        }
      }

      /* Tablet: 768px - 899px */
      @media (max-width: 899px) {
        .markets-hero {
          height: 65vh;
          min-height: 450px;
        }
        .markets-hero__title {
          font-size: 46px;
          margin-bottom: 20px;
        }
        .markets-hero__subtitle {
          font-size: 19px;
        }
      }

      /* Mobile Large: 600px - 767px */
      @media (max-width: 767px) {
        .markets-hero {
          height: 60vh;
          min-height: 420px;
        }
        .markets-hero__content {
          padding: 0 24px;
        }
        .markets-hero__title {
          font-size: 38px;
          letter-spacing: -0.8px;
          margin-bottom: 18px;
        }
        .markets-hero__subtitle {
          font-size: 17px;
          line-height: 1.5;
        }
      }

      /* Mobile: 480px - 599px */
      @media (max-width: 599px) {
        .markets-hero {
          height: 55vh;
          min-height: 380px;
        }
        .markets-hero__content {
          padding: 0 20px;
        }
        .markets-hero__title {
          font-size: 32px;
          letter-spacing: -0.6px;
        }
        .markets-hero__subtitle {
          font-size: 16px;
        }
      }

      /* Mobile Small: 360px - 479px */
      @media (max-width: 479px) {
        .markets-hero {
          min-height: 360px;
        }
        .markets-hero__title {
          font-size: 28px;
        }
        .markets-hero__subtitle {
          font-size: 15px;
        }
      }

      /* Mobile XS: < 360px */
      @media (max-width: 359px) {
        .markets-hero {
          min-height: 340px;
        }
        .markets-hero__content {
          padding: 0 16px;
        }
        .markets-hero__title {
          font-size: 26px;
        }
        .markets-hero__subtitle {
          font-size: 14px;
        }
      }
    </style>
  </body>
</html>
