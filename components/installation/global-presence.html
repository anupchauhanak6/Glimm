    <style>
      .installation-global-presence,
      .installation-global-presence * {
        box-sizing: border-box;
      }

      .installation-global-presence {
        font-family: "Inter", sans-serif;
        padding: 90px 20px;
        background: #f7f8fc;
      }

      .installation-global-presence__container {
        max-width: 1240px;
        width: 100%;
        margin: 0 auto;
      }

      .installation-global-presence__header {
        text-align: center;
        margin: 0 auto 24px;
        max-width: 760px;
      }

      .installation-global-presence__badge {
        display: inline-block;
        background: rgba(43, 77, 255, 0.09);
        color: #2b4dff;
        padding: 8px 15px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      .installation-global-presence__header h2 {
        margin: 0 0 8px;
        font-size: 35px;
        color: #1a237e;
      }

      .installation-global-presence__header p {
        margin: 0;
        color: #64748b;
      }

      .global-map {
        position: relative;
        width: 100%;
        aspect-ratio: 1536 / 982;
        border-radius: 26px;
        border: 1px solid #e3e7f5;
        background: #edf2fb;
        overflow: hidden;
      }

      .global-map__svg-slot {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background-color: #edf2fb;
        background-image: radial-gradient(
          circle,
          rgba(189, 198, 224, 0.55) 2px,
          transparent 2px
        );
        background-size: 34px 34px;
      }

      .global-map__svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .global-map__svg path:first-child {
        fill: transparent !important;
      }

      .global-map__svg path[fill="#E5EBF1"] {
        fill: #c9d7f2;
      }

      .global-map__svg path[fill="#F6F8FA"] {
        fill: #edf3ff;
      }

      @media (max-width: 1100px) {
        .global-map__svg-slot {
          background-size: 30px 30px;
        }
      }

      @media (max-width: 820px) {
        .global-map {
          aspect-ratio: 16 / 11;
        }

        .global-map__svg-slot {
          background-size: 26px 26px;
        }
      }

      @media (max-width: 620px) {
        .installation-global-presence {
          padding: 70px 14px;
        }

        .installation-global-presence__header h2 {
          font-size: 28px;
        }

        .global-map {
          aspect-ratio: 16 / 12;
        }

        .global-map__svg-slot {
          background-size: 24px 24px;
        }
      }
    </style>
