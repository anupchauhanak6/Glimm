<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trusted Brands & Partners</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="installation-client-logos">
      <div class="installation-client-logos__container">
        <h2>Trusted Brands & Partners</h2>

        <div class="installation-client-logos__marquee-wrap">
          <div class="installation-client-logos__marquee" role="list">
            <!-- NEW WAVE Logo -->
            <svg

              role="listitem"
            >
              <text
                x="8"

                font-family="Arial, sans-serif"
                font-size="18"
                font-weight="bold"
                fill="#2a2a2a"
                letter-spacing="2"

                NEW
              </text>
              <text
                x="8"
                y="42"
                font-family="Arial, sans-serif"
                font-size="16"
                font-weight="600"
                fill="#a8a8a8"
                letter-spacing="1"
              >
                WAVE
              </text>
            </svg>

            <!-- ORGANIC Logo -->
            <svg
              class="client-logo__img"
              viewBox="0 0 140 50"
              xmlns="http://www.w3.org/2000/svg"
              preserveAspectRatio="xMidYMid meet"
              role="listitem"
            >
              <circle
                cx="35"
                cy="25"
                r="18"
                fill="none"
                stroke="#7a7a7a"
                stroke-width="1.5"
              />
              <text
                x="60"
                y="28"
                font-family="Arial, sans-serif"
                font-size="14"
                font-weight="600"
                fill="#4a4a4a"
                letter-spacing="0.5"
              >
                ORGANIC
              </text>
              <text
                x="60"
                y="40"
                font-family="Arial, sans-serif"
                font-size="10"
                fill="#999999"
              >
                COMMERCE
              </text>
            </svg>

            <!-- MOCKUP Logo -->
            <svg
              class="client-logo__img"
              viewBox="0 0 140 50"
              xmlns="http://www.w3.org/2000/svg"
              preserveAspectRatio="xMidYMid meet"
              role="listitem"
            >
              <text
                x="8"
                y="32"
                font-family="Georgia, serif"
                font-size="22"
                font-weight="bold"
                fill="#1a1a1a"
                font-style="italic"
              >
                Mockup
              </text>
              <text
                x="8"
                y="44"
                font-family="Arial, sans-serif"
                font-size="9"
                fill="#888888"
                letter-spacing="1"
              >
                ACCESSORIES
              </text>
            </svg>

            <!-- ALISA Logo -->
            <svg
              class="client-logo__img"
              viewBox="0 0 140 50"
              xmlns="http://www.w3.org/2000/svg"
              preserveAspectRatio="xMidYMid meet"
              role="listitem"
            >
              <rect
                x="8"
                y="8"
                width="32"
                height="32"
                rx="4"
                fill="#d0d0d0"
                opacity="0.6"
              />
              <text
                x="47"
                y="28"
                font-family="Georgia, serif"
                font-size="16"
                font-weight="300"
                fill="#3a3a3a"
                letter-spacing="1"
              >
                Alisa
              </text>
              <text
                x="48"
                y="41"
                font-family="Arial, sans-serif"
                font-size="9"
                fill="#999999"
              >
                DESIGN
              </text>
            </svg>

            <!-- JAMIEKANNIE Logo -->
            <svg
              class="client-logo__img"
              viewBox="0 0 140 50"
              xmlns="http://www.w3.org/2000/svg"
              preserveAspectRatio="xMidYMid meet"
              role="listitem"
            >
              <text
                x="8"
                y="28"
                font-family="Arial, sans-serif"
                font-size="13"
                font-weight="600"
                fill="#2a2a2a"
                letter-spacing="2"
              >
                JAMIEKANNIE
              </text>
              <text
                x="8"
                y="42"
                font-family="Arial, sans-serif"
                font-size="9"
                fill="#a8a8a8"
                letter-spacing="1"
              >
                STUDIO
              </text>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: "Inter", sans-serif;
      }

      .installation-client-logos,
      .installation-client-logos * {
        box-sizing: border-box;
      }

      .installation-client-logos {
        font-family: "Inter", sans-serif;
        background: #ffffff;
        padding: 70px 20px;
        overflow: hidden;
      }

      .installation-client-logos__container {
        max-width: 1240px;
        margin: 0 auto;
      }

      .installation-client-logos h2 {
        margin: 0 0 24px;
        text-align: center;
        color: #1a237e;
        font-size: 32px;
      }

      .installation-client-logos__marquee-wrap {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        padding: 14px 0;
      }

      .installation-client-logos__marquee-wrap::before,
      .installation-client-logos__marquee-wrap::after {
        content: "";
        position: absolute;
        top: 0;
        width: 80px;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }

      .installation-client-logos__marquee-wrap::before {
        left: 0;
        background: linear-gradient(
          90deg,
          #f8fafc 0%,
          rgba(248, 250, 252, 0) 100%
        );
      }

      .installation-client-logos__marquee-wrap::after {
        right: 0;
        background: linear-gradient(
          270deg,
          #f8fafc 0%,
          rgba(248, 250, 252, 0) 100%
        );
      }

      .installation-client-logos__marquee {
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 40px;
        width: 100%;
        padding: 8px 0;
      }

      .client-logo__img {
        width: 130px;
        height: 50px;
        flex-shrink: 0;
        object-fit: contain;
        object-position: center;
        display: block;
      }

      /* JavaScript handles continuous looping for a single set of logos */

      @media (max-width: 640px) {
        .installation-client-logos {
          padding: 60px 14px;
        }

        .installation-client-logos h2 {
          font-size: 25px;
        }

        .installation-client-logos__marquee {
          gap: 24px;
        }

        .client-logo__img {
          width: 100px;
          height: 38px;
        }
      }
    </style>
    <script>
      (function () {
        const wrap = document.querySelector(
          ".installation-client-logos__marquee-wrap",
        );
        const marquee = document.querySelector(
          ".installation-client-logos__marquee",
        );
        if (!wrap || !marquee) return;

        let speed = 60; // pixels per second, adjust as needed
        let rafId = null;
        let lastTime = null;
        let transformX = 0;

        function step(t) {
          if (lastTime == null) lastTime = t;
          const delta = (t - lastTime) / 1500; // seconds
          lastTime = t;
          transformX -= speed * delta;

          marquee.style.transform = `translateX(${transformX}px)`;

          const first = marquee.children[0];
          if (first) {
            const firstRect = first.getBoundingClientRect();
            const wrapRect = wrap.getBoundingClientRect();

            // when first item's right has moved past the left edge
            if (firstRect.right - 1 <= wrapRect.left) {
              const next = marquee.children[1];
              let gap = 0;
              if (next) {
                const nextRect = next.getBoundingClientRect();
                gap = Math.max(0, nextRect.left - firstRect.right);
              }

              const shift = firstRect.width + gap;

              // append first to the end and compensate transform so visual stays continuous
              marquee.appendChild(first);
              transformX += shift;
              marquee.style.transform = `translateX(${transformX}px)`;
            }
          }

          rafId = requestAnimationFrame(step);
        }

        function start() {
          if (rafId) cancelAnimationFrame(rafId);
          lastTime = null;          rafId = requestAnimationFrame(step);
        }

        function onResize() {
          // reset transform so layout stays correct
          transformX = 0;
          marquee.style.transform = "translateX(0px)";
        }

        window.addEventListener("resize", onResize);
        start();
      })();
    </script>
  </body>
</html>
