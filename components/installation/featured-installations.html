<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Featured Installations</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <section class="featured-installations">
      <div class="featured-installations__container">
        <div class="featured-installations__header">
          <span class="featured-installations__badge"
            >Featured Installations</span
          >
          <h2>Real Projects. Real Impact.</h2>
          <p>
            Explore our work across industries with tailored holographic
            solutions.
          </p>
        </div>

        <div
          class="featured-installations__filters"
          id="featuredInstallFilters"
        ></div>
        <div
          class="featured-installations__grid"
          id="featuredInstallGrid"
        ></div>
      </div>
    </section>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: "Inter", sans-serif;
      }

      .featured-installations,
      .featured-installations * {
        box-sizing: border-box;
      }

      .featured-installations {
        font-family: "Inter", sans-serif;
        padding: 90px 20px;
        background: #ffffff;
      }

      .featured-installations__container {
        max-width: 1220px;
        margin: 0 auto;
      }

      .featured-installations__header {
        text-align: center;
        max-width: 760px;
        margin: 0 auto 30px;
      }

      .featured-installations__badge {
        display: inline-block;
        padding: 8px 16px;
        background: rgba(26, 35, 126, 0.08);
        color: #1a237e;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .featured-installations__header h2 {
        margin: 0 0 10px;
        color: #0f172a;
        font-size: 36px;
      }

      .featured-installations__header p {
        margin: 0;
        color: #64748b;
        font-size: 16px;
      }

      .featured-installations__filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 26px;
      }

      .featured-filter-btn {
        border: 1px solid #dbe1ff;
        background: #f8faff;
        color: #1a237e;
        border-radius: 999px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .featured-filter-btn.active {
        background: #2b4dff;
        color: #ffffff;
        border-color: #2b4dff;
      }

      .featured-installations__grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }

      .featured-install-card {
        border: 2px solid #e5e7eb;
        border-radius: 20px;
        overflow: hidden;
        background: #fff;
        display: flex;
        flex-direction: column;
        min-height: 100%;
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        animation: slideUp 0.6s ease-out forwards;
        position: relative;
      }

      .featured-install-card:hover {
        box-shadow: 0 20px 60px rgba(43, 77, 255, 0.15);
        transform: translateY(-8px);
        border-color: rgba(43, 77, 255, 0.3);
      }

      .featured-install-card:hover img {
        transform: scale(1.04);
      }

      .featured-install-card img {
        width: 100%;
        height: 240px;
        object-fit: cover;
        display: block;
        transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      }

      .featured-install-card__body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
      }

      .featured-install-card__title {
        margin: 0;
        color: #1a237e;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
      }

      .featured-install-card__meta {
        color: #475569;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .featured-install-card__meta i {
        color: #2b4dff;
        width: 18px;
        margin-right: 8px;
      }

      .featured-install-card__desc {
        color: #64748b;
        font-size: 15px;
        line-height: 1.6;
        margin: 0;
        flex: 1;
      }

      .featured-install-card__btn {
        margin-top: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: #ffffff;
        background: #2b4dff;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 18px;
        border-radius: 50px;
        width: fit-content;
        transition: inherit;
      }

      .featured-install-card__btn:hover {
        background: #1a237e;
      }

      .featured-install-card__btn i {
        transition: transform 0.3s ease;
      }

      .featured-install-card:hover .featured-install-card__btn i {
        transform: translateX(4px);
      }

      @media (max-width: 1024px) {
        .featured-installations__grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 640px) {
        .featured-installations {
          padding: 70px 16px;
        }

        .featured-installations__header h2 {
          font-size: 30px;
        }

        .featured-installations__grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <script>
      (function () {
        const data = [
          {
            title: "Luxury Mall Activation",
            location: "Dubai, UAE",
            category: "Retail",
            solution: "Transparent Hologram Screen",
            description:
              "Premium storefront installation designed for continuous product storytelling.",
            image:
              "https://images.unsplash.com/photo-1555421689-d68471e189f2?w=900&h=620&fit=crop",
          },
          {
            title: "Global Product Launch Stage",
            location: "Mumbai, India",
            category: "Events",
            solution: "Holographic Stage Projection",
            description:
              "High-brightness projection setup for launch keynote and brand reveal moments.",
            image:
              "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=900&h=620&fit=crop",
          },
          {
            title: "Airport Facade Showcase",
            location: "Singapore",
            category: "Outdoor",
            solution: "High-Lumen Outdoor Display",
            description:
              "Weather-ready installation optimized for visibility in variable lighting.",
            image:
              "https://images.unsplash.com/photo-1489515217757-5fd1be406fef?w=900&h=620&fit=crop",
          },
          {
            title: "Executive Experience Center",
            location: "London, UK",
            category: "Corporate",
            solution: "Interactive Presentation Wall",
            description:
              "Boardroom-grade installation for immersive internal and client presentations.",
            image:
              "https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=900&h=620&fit=crop",
          },
          {
            title: "Smart Showroom Kiosk",
            location: "Tokyo, Japan",
            category: "Interactive",
            solution: "Touch + Gesture Hologram Kiosk",
            description:
              "Interactive product explorer with live data overlays and touch integration.",
            image:
              "https://images.unsplash.com/photo-1518770660439-4636190af475?w=900&h=620&fit=crop",
          },
          {
            title: "Digital Heritage Gallery",
            location: "Paris, France",
            category: "Museum",
            solution: "Artifact Revival Projection",
            description:
              "Museum-safe visual layer to present historic stories without touching originals.",
            image:
              "https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=900&h=620&fit=crop",
          },
        ];

        const categories = [
          "All",
          "Retail",
          "Events",
          "Outdoor",
          "Corporate",
          "Interactive",
          "Museum",
        ];

        const filterWrap = document.getElementById("featuredInstallFilters");
        const grid = document.getElementById("featuredInstallGrid");
        if (!filterWrap || !grid) return;

        let activeCategory = "All";

        function renderFilters() {
          filterWrap.innerHTML = categories
            .map(
              (cat) =>
                `<button class="featured-filter-btn ${cat === activeCategory ? "active" : ""}" data-cat="${cat}">${cat}</button>`,
            )
            .join("");
        }

        function renderGrid() {
          const rows =
            activeCategory === "All"
              ? data
              : data.filter((item) => item.category === activeCategory);

          grid.innerHTML = rows
            .map(
              (item) => `
              <article class="featured-install-card">
                <img src="${item.image}" alt="${item.title}" />
                <div class="featured-install-card__body">
                  <h3 class="featured-install-card__title">${item.title}</h3>
                  <div class="featured-install-card__meta">
                    <span><i class="fas fa-map-marker-alt"></i>${item.location}</span>
                    <span><i class="fas fa-cube"></i>${item.solution}</span>
                  </div>
                  <p class="featured-install-card__desc">${item.description}</p>
                  <a href="#contact" class="featured-install-card__btn">Explore Installation <i class="fas fa-arrow-right"></i></a>
                </div>
              </article>
            `,
            )
            .join("");
        }

        filterWrap.addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-cat]");
          if (!btn) return;
          activeCategory = btn.getAttribute("data-cat") || "All";
          renderFilters();
          renderGrid();
        });

        renderFilters();
        renderGrid();
      })();
    </script>
  </body>
</html>
