<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Projects CTA Section -->
    <section class="projects-cta">
      <div class="projects-cta__container">
        <div class="projects-cta__content">
          <h2
            class="projects-cta__heading fade-in-up"
            style="animation-delay: 0.1s"
          >
            Start Your Hologram Project
          </h2>
          <p
            class="projects-cta__subtext fade-in-up"
            style="animation-delay: 0.2s"
          >
            Transform your space with cutting-edge holographic technology. Our
            team of experts is ready to bring your vision to life.
          </p>
          <div
            class="projects-cta__button-wrapper fade-in-up"
            style="animation-delay: 0.3s"
          >
            <a href="#" class="projects-cta__btn">
              Contact Us <i class="fas fa-arrow-right"></i>
            </a>
          </div>
        </div>
      </div>
    </section>

    <style>
      /* ===========================================           UNIVERSAL BOX SIZING
           =========================================== */
      .projects-cta *,
      .projects-cta *::before,
      .projects-cta *::after {
        box-sizing: border-box;
      }

      /* ===========================================           PROJECTS CTA SECTION - CSS VARIABLES
           =========================================== */
      :root {
        --cta-navy: #0a0e27;
        --cta-blue: #1a237e;
        --cta-gold: #d4af37;
        --cta-white: #ffffff;
      }

      /* ===========================================
           CTA SECTION BASE LAYOUT
           =========================================== */
      .projects-cta {
        width: 100%;
        max-width: 100vw;
        background: linear-gradient(
          135deg,
          var(--cta-navy) 0%,
          #151d52 35%,
          var(--cta-blue) 100%
        );
        padding: 130px 40px;
        font-family: "Inter", sans-serif;
        position: relative;
        overflow: hidden;
      }

      .projects-cta::before,
      .projects-cta::after {
        pointer-events: none;
      }

      /* Decorative Background Elements */
      .projects-cta::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -10%;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(212, 175, 55, 0.1) 0%,
          transparent 70%
        );
        border-radius: 50%;
      }

      .projects-cta::after {
        content: "";
        position: absolute;
        bottom: -50%;
        left: -10%;
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(26, 35, 126, 0.3) 0%,
          transparent 70%
        );
        border-radius: 50%;
      }

      .projects-cta__container {
        max-width: 1000px;
        margin: 0 auto;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      /* ===========================================
           CTA CONTENT
           =========================================== */
      .projects-cta__content {
        color: var(--cta-white);
      }

      .projects-cta__heading {
        font-size: 60px;
        font-weight: 800;
        line-height: 1.2;
        margin: 0 0 28px 0;
        background: linear-gradient(135deg, var(--cta-white) 0%, #e0e7ff 70%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -1.5px;
      }

      .projects-cta__subtext {
        font-size: 21px;
        font-weight: 400;
        line-height: 1.8;
        margin: 0 0 44px 0;
        color: rgba(255, 255, 255, 0.9);
        max-width: 750px;
        margin-left: auto;
        margin-right: auto;
      }

      .projects-cta__button-wrapper {
        display: flex;
        justify-content: center;
        margin-top: 40px;
      }

      /* ===========================================
           CTA BUTTON
           =========================================== */
      .projects-cta__btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-family: "Inter", sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: var(--cta-navy);
        background: linear-gradient(135deg, var(--cta-gold) 0%, #f0d878 100%);
        padding: 20px 52px;
        border-radius: 50px;
        text-decoration: none;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow:
          0 10px 30px rgba(212, 175, 55, 0.35),
          0 0 0 0 rgba(212, 175, 55, 0.5);
        position: relative;
        overflow: hidden;
        animation: pulse-shadow 2s infinite;
      }

      @keyframes pulse-shadow {
        0%,
        100% {
          box-shadow:
            0 10px 30px rgba(212, 175, 55, 0.35),
            0 0 0 0 rgba(212, 175, 55, 0);
        }
        50% {
          box-shadow:
            0 10px 30px rgba(212, 175, 55, 0.35),
            0 0 0 10px rgba(212, 175, 55, 0);
        }
      }

      /* Button Shine Effect */
      .projects-cta__btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        transition: left 0.6s ease;
      }

      .projects-cta__btn:hover::before {
        left: 100%;
      }

      /* Button Hover State */
      .projects-cta__btn:hover {
        background: linear-gradient(
          135deg,
          var(--cta-gold) 0%,
          var(--cta-navy) 100%
        );
        box-shadow: 0 12px 32px rgba(212, 175, 55, 0.5);
        transform: translateY(-3px);
      }

      .projects-cta__btn i {
        font-size: 16px;
        transition: transform 0.3s ease;
      }

      .projects-cta__btn:hover i {
        transform: translateX(5px);
      }

      /* ===========================================
           ANIMATIONS
           =========================================== */
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in-up {
        animation: fade-in-up 0.8s ease-out forwards;
        opacity: 0;
      }

      /* ===========================================
           RESPONSIVE DESIGN
           =========================================== */

      /* Large Desktop */
      @media (max-width: 1400px) {
        .projects-cta {
          padding: 100px 40px;
        }

        .projects-cta__heading {
          font-size: 52px;
        }

        .projects-cta__subtext {
          font-size: 19px;
        }
      }

      /* Desktop */
      @media (max-width: 1200px) {
        .projects-cta {
          padding: 90px 30px;
        }

        .projects-cta__heading {
          font-size: 48px;
        }

        .projects-cta__subtext {
          font-size: 18px;
        }

        .projects-cta__btn {
          font-size: 17px;
          padding: 16px 44px;
        }
      }

      /* Tablet Large */
      @media (max-width: 900px) {
        .projects-cta {
          padding: 80px 24px;
        }

        .projects-cta__heading {
          font-size: 44px;
          margin-bottom: 22px;
        }

        .projects-cta__subtext {
          font-size: 18px;
          margin-bottom: 36px;
          max-width: 650px;
        }

        .projects-cta__btn {
          font-size: 17px;
          padding: 16px 44px;
        }

        .projects-cta__button-wrapper {
          margin-top: 36px;
        }
      }

      /* Tablet */
      @media (max-width: 768px) {
        .projects-cta {
          padding: 70px 20px;
        }

        .projects-cta__heading {
          font-size: 40px;
          margin-bottom: 20px;
        }

        .projects-cta__subtext {
          font-size: 17px;
          max-width: 600px;
        }

        .projects-cta__btn {
          font-size: 16px;
          padding: 15px 40px;
          min-height: 50px;
        }
      }

      /* Mobile Large */
      @media (max-width: 600px) {
        .projects-cta {
          padding: 60px 18px;
        }

        .projects-cta__heading {
          font-size: 34px;
          margin-bottom: 18px;
          line-height: 1.2;
        }

        .projects-cta__subtext {
          font-size: 16px;
          margin-bottom: 30px;
          max-width: 100%;
          line-height: 1.6;
        }

        .projects-cta__btn {
          font-size: 15px;
          padding: 14px 38px;
          min-height: 48px;
        }

        .projects-cta__button-wrapper {
          margin-top: 30px;
        }
      }

      /* Mobile Small */
      @media (max-width: 400px) {
        .projects-cta {
          padding: 50px 16px;
        }

        .projects-cta__heading {
          font-size: 30px;
          margin-bottom: 16px;
        }

        .projects-cta__subtext {
          font-size: 15px;
          line-height: 1.55;
        }

        .projects-cta__btn {
          font-size: 14px;
          padding: 13px 32px;
          min-height: 46px;
        }
      }
    </style>
  </body>
</html>
