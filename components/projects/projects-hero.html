<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Projects Hero Section -->
    <section class="projects-hero">
      <!-- Background Video Layer -->
      <div class="projects-hero__video-container">
        <video
          class="projects-hero__video"
          autoplay
          muted
          loop
          playsinline
          poster="assets/videos/hero-poster.jpg"
        >
          <source src="assets/videos/hero-hologram.mp4" type="video/mp4" />
          <source src="assets/videos/hero-hologram.webm" type="video/webm" />
        </video>
        <!-- Dark Gradient Overlay -->
        <div class="projects-hero__overlay"></div>
      </div>

      <!-- Hero Content -->
      <div class="projects-hero__content">
        <div class="projects-hero__text-wrapper">
          <h1
            class="projects-hero__title fade-in-up"
            style="animation-delay: 0.1s"
          >
            Our Projects
          </h1>
          <p
            class="projects-hero__subtitle fade-in-up"
            style="animation-delay: 0.2s"
          >
            Real-world hologram installations across industries
          </p>
        </div>
      </div>
    </section>

    <style>
      /* ===========================================           UNIVERSAL BOX SIZING
           =========================================== */
      .projects-hero *,
      .projects-hero *::before,
      .projects-hero *::after {
        box-sizing: border-box;
      }

      /* ===========================================           PROJECTS HERO SECTION - CSS VARIABLES
           =========================================== */
      :root {
        --hero-navy: #0a0e27;
        --hero-blue: #1a237e;
        --hero-gold: #d4af37;
        --hero-white: #ffffff;
        --hero-overlay: rgba(10, 14, 39, 0.75);
      }

      /* ===========================================
           HERO SECTION BASE LAYOUT
           =========================================== */
      .projects-hero {
        position: relative;
        width: 100%;
        max-width: 100vw;
        height: 75vh;
        min-height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }

      /* ===========================================
           VIDEO BACKGROUND
           =========================================== */
      .projects-hero__video-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .projects-hero__video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      /* Dark Gradient Overlay */
      .projects-hero__overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(26, 35, 126, 0.85) 0%,
          rgba(10, 14, 39, 0.9) 50%,
          rgba(0, 0, 0, 0.85) 100%
        );
        z-index: 2;
      }

      /* ===========================================
           HERO CONTENT
           =========================================== */
      .projects-hero__content {
        position: relative;
        z-index: 10;
        text-align: center;
        color: var(--hero-white);
        max-width: 1000px;
        padding: 0 30px;
      }

      .projects-hero__text-wrapper {
        margin-bottom: 0;
      }

      .projects-hero__title {
        font-size: 80px;
        font-weight: 800;
        line-height: 1.1;
        margin: 0 0 28px 0;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #e0e7ff 50%,
          #b3c5ff 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -2px;
        text-shadow: 0 0 40px rgba(26, 35, 126, 0.3);
      }

      .projects-hero__subtitle {
        font-size: 26px;
        font-weight: 400;
        line-height: 1.6;
        margin: 0;
        color: rgba(255, 255, 255, 0.95);
        letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      /* ===========================================
           ANIMATIONS
           =========================================== */
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in-up {
        animation: fade-in-up 0.8s ease-out forwards;
        opacity: 0;
      }

      /* ===========================================
           RESPONSIVE DESIGN
           =========================================== */

      /* Large Desktop */
      @media (max-width: 1400px) {
        .projects-hero__title {
          font-size: 64px;
        }
        .projects-hero__subtitle {
          font-size: 22px;
        }
      }

      /* Desktop */
      @media (max-width: 1200px) {
        .projects-hero__title {
          font-size: 56px;
        }
        .projects-hero__subtitle {
          font-size: 20px;
        }
      }

      /* Tablet Large */
      @media (max-width: 900px) {
        .projects-hero {
          height: 65vh;
          min-height: 450px;
        }

        .projects-hero__content {
          padding: 0 30px;
        }

        .projects-hero__title {
          font-size: 48px;
          letter-spacing: -1.5px;
        }

        .projects-hero__subtitle {
          font-size: 18px;
        }
      }

      /* Tablet */
      @media (max-width: 768px) {
        .projects-hero {
          height: 60vh;
          min-height: 420px;
        }

        .projects-hero__title {
          font-size: 44px;
          margin-bottom: 22px;
        }

        .projects-hero__subtitle {
          font-size: 17px;
        }
      }

      /* Mobile Large */
      @media (max-width: 600px) {
        .projects-hero {
          height: 55vh;
          min-height: 380px;
        }

        .projects-hero__content {
          padding: 0 20px;
        }

        .projects-hero__title {
          font-size: 38px;
          margin-bottom: 18px;
          letter-spacing: -1px;
        }

        .projects-hero__subtitle {
          font-size: 15px;
          line-height: 1.5;
        }
      }

      /* Mobile Small */
      @media (max-width: 400px) {
        .projects-hero {
          height: 50vh;
          min-height: 350px;
        }

        .projects-hero__content {
          padding: 0 16px;
        }

        .projects-hero__title {
          font-size: 32px;
          margin-bottom: 16px;
        }

        .projects-hero__subtitle {
          font-size: 14px;
        }
      }
    </style>
  </body>
</html>
