<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Installation Services - Hologram Technology</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        width: 100%;
      }

      html,
      body {
        overflow-x: hidden;
        max-width: 100vw;
      }

      #installation-hero {
        margin-top: 60px;
      }
    </style>
  </head>
  <body>
    <!-- Header Component -->
    <div id="header"></div>

    <!-- Installation Hero Section -->
    <div id="installation-hero"></div>

    <!-- Installation Process Section -->
    <div id="installation-process"></div>

    <!-- What We Handle Section -->
    <div id="what-we-handle"></div>

    <!-- Installation Environments Section -->
    <div id="installation-environments"></div>

    <!-- Installation Gallery Section -->
    <div id="installation-gallery"></div>

    <!-- Why Choose Us Section -->
    <div id="why-choose-us"></div>

    <!-- Footer Component -->
    <div id="footer"></div>

    <!-- Component Loader Script -->
    <script src="script.js"></script>

    <!-- Load Installation Components -->
    <script>
      // Load shared header and footer
      loadComponentFrom("components", "header.html", "header");
      loadComponentFrom("components", "footer.html", "footer");

      // Load installation-specific components
      loadComponentFrom(
        "components/installation",
        "installation-hero.html",
        "installation-hero",
      );
      loadComponentFrom(
        "components/installation",
        "installation-process.html",
        "installation-process",
      );
      loadComponentFrom(
        "components/installation",
        "what-we-handle.html",
        "what-we-handle",
      );
      loadComponentFrom(
        "components/installation",
        "installation-environments.html",
        "installation-environments",
      );
      loadComponentFrom(
        "components/installation",
        "installation-gallery.html",
        "installation-gallery",
      );
      loadComponentFrom(
        "components/installation",
        "why-choose-us.html",
        "why-choose-us",
      );
    </script>
  </body>
</html>
